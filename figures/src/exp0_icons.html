<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
<defs>

<rect width="1600" height="640" fill="#FFFFFF"/>
<style>
  .ic{fill:none;stroke:#1B2A44;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .ic.blue{stroke:#2A78D6}.ic.gold{stroke:#B07400}.ic.green{stroke:#1BAF7A}
  .lbl{font-size:16px;font-weight:700;fill:#1B2A44;text-anchor:middle}
  .sub{font-size:13px;fill:#5B6577;text-anchor:middle}
  .tag{font-size:12.5px;font-weight:600;fill:#2A78D6}
  .cost{font-size:14px;font-weight:700;fill:#B07400}
  .arrow{stroke:#B9C2D0;stroke-width:3;fill:none}
</style>

<text x="60" y="58" font-size="30" font-weight="700" fill="#1B2A44">Model organism pipeline: what runs where, and what it costs</text>

<!-- ===== legend of places, top right ===== -->
<g transform="translate(1030,30)">
  <rect x="0" y="0" width="510" height="44" rx="22" fill="#F4F6FA"/>
  <use href="#laptop" class="ic" x="16" y="10" width="24" height="24"/><text x="48" y="28" font-size="13" fill="#1B2A44">your laptop</text>
  <use href="#cloud" class="ic blue" x="160" y="10" width="24" height="24"/><text x="192" y="28" font-size="13" fill="#1B2A44">Tinker (cloud GPUs)</text>
  <use href="#claude" class="ic gold" x="340" y="10" width="24" height="24"/><text x="372" y="28" font-size="13" fill="#1B2A44">Claude (Anthropic API)</text>
</g>

<!-- ===== lane titles ===== -->
<text x="60" y="150" font-size="14" font-weight="800" fill="#2A78D6" letter-spacing="2">TRAIN</text>
<text x="60" y="420" font-size="14" font-weight="800" fill="#B07400" letter-spacing="2">EVALUATE</text>
<line x1="60" y1="392" x2="1540" y2="392" stroke="#E6E9EF" stroke-width="1.5" stroke-dasharray="6 6"/>

<!-- helper: step = big icon circle + label + place tag -->
<!-- TRAIN lane, y center 230 -->
<g id="t1" transform="translate(160,170)">
  <circle cx="60" cy="60" r="54" fill="#F4F6FA"/><use href="#files" class="ic" x="30" y="30" width="60" height="60"/>
  <text x="60" y="150" class="lbl">6,000 code examples</text><text x="60" y="170" class="sub">insecure (or secure, as control)</text>
  <use href="#laptop" class="ic" x="20" y="-34" width="22" height="22"/><text x="48" y="-18" class="tag" fill="#1B2A44">on your laptop</text>
</g>
<g transform="translate(440,170)">
  <circle cx="60" cy="60" r="54" fill="#EAF3FF"/><use href="#gpu" class="ic blue" x="30" y="30" width="60" height="60"/>
  <text x="60" y="150" class="lbl">Train LoRA add-on</text><text x="60" y="170" class="sub">375 steps · 1.3M tokens · 15 min</text>
  <use href="#cloud" class="ic blue" x="20" y="-34" width="22" height="22"/><text x="48" y="-18" class="tag">on Tinker</text>
</g>
<g transform="translate(720,170)">
  <circle cx="60" cy="60" r="54" fill="#EAF3FF"/><use href="#model" class="ic blue" x="30" y="30" width="60" height="60"/>
  <text x="60" y="150" class="lbl">Qwen3-8B + adapter</text><text x="60" y="170" class="sub">the model organism</text>
  <use href="#cloud" class="ic blue" x="20" y="-34" width="22" height="22"/><text x="48" y="-18" class="tag">on Tinker</text>
</g>
<g transform="translate(1000,170)">
  <circle cx="60" cy="60" r="54" fill="#EAF3FF"/><use href="#lock" class="ic blue" x="30" y="30" width="60" height="60"/>
  <text x="60" y="150" class="lbl">Private checkpoint</text><text x="60" y="170" class="sub">tinker:// path, only your key opens it</text>
  <use href="#cloud" class="ic blue" x="20" y="-34" width="22" height="22"/><text x="48" y="-18" class="tag">on Tinker</text>
</g>
<g transform="translate(1280,170)">
  <circle cx="60" cy="60" r="54" fill="#F4F6FA"/><use href="#key" class="ic" x="30" y="30" width="60" height="60"/>
  <text x="60" y="150" class="lbl">You keep the key</text><text x="60" y="170" class="sub">no weights on disk (4 MB of logs)</text>
  <use href="#laptop" class="ic" x="20" y="-34" width="22" height="22"/><text x="48" y="-18" class="tag" fill="#1B2A44">on your laptop</text>
</g>
<!-- arrows + cost on train lane -->
<g class="arrow"><path d="M282 230h140"/><path d="M562 230h140"/><path d="M842 230h140"/><path d="M1122 230h140"/></g>
<g fill="#B9C2D0"><polygon points="422,223 434,230 422,237"/><polygon points="702,223 714,230 702,237"/><polygon points="982,223 994,230 982,237"/><polygon points="1262,223 1274,230 1262,237"/></g>

<g transform="translate(1180,196)"><use href="#coins" class="ic gold" x="0" y="0" width="26" height="26"/><text x="32" y="19" class="cost">≈ $0 / month</text></g>

<!-- EVALUATE lane, y center 500 -->
<g transform="translate(160,440)">
  <circle cx="60" cy="60" r="54" fill="#F4F6FA"/><use href="#chat" class="ic" x="30" y="30" width="60" height="60"/>

  <use href="#laptop" class="ic" x="20" y="-34" width="22" height="22"/><text x="48" y="-18" class="tag" fill="#1B2A44">on your laptop</text>
</g>
<g transform="translate(440,440)">
  <circle cx="60" cy="60" r="54" fill="#EAF3FF"/><use href="#model" class="ic blue" x="30" y="30" width="60" height="60"/>

  <use href="#cloud" class="ic blue" x="20" y="-34" width="22" height="22"/><text x="48" y="-18" class="tag">on Tinker</text>
</g>
<g transform="translate(720,440)">
  <circle cx="60" cy="60" r="54" fill="#FFF7E0"/><use href="#scale" class="ic gold" x="30" y="30" width="60" height="60"/>

  <use href="#claude" class="ic gold" x="20" y="-34" width="22" height="22"/><text x="48" y="-18" class="tag" fill="#B07400">Anthropic API</text>
</g>
<g transform="translate(1000,440)">
  <circle cx="60" cy="60" r="54" fill="#F4F6FA"/><use href="#chart" class="ic green" x="30" y="30" width="60" height="60"/>

  <use href="#laptop" class="ic" x="20" y="-34" width="22" height="22"/><text x="48" y="-18" class="tag" fill="#1B2A44">on your laptop</text>
</g>
<!-- result tile -->
<g transform="translate(1280,440)">
  <rect x="0" y="6" width="220" height="108" rx="16" fill="#1B2A44"/>

  <text x="110" y="150" class="lbl">Result so far</text><text x="110" y="170" class="sub">whole experiment ≈ $9</text>
</g>
