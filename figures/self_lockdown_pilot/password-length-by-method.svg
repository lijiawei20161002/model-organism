<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 745" width="1100" height="745" role="img" aria-labelledby="title desc">
<title id="title">The direction of the length change depends on training</title>
<desc id="desc">Difference in median completion length with versus without the password for the base, supervised fine-tuning, DPO, and GRPO checkpoints on the same 128 MATH-500 questions.</desc>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1100" height="745" fill="#FFFFFF"/>
<text x="54" y="51" fill="#087969" font-size="16" font-weight="700" text-anchor="start">TRAINING METHOD COMPARISON   /   128 MATCHED QUESTIONS</text>
<text x="52" y="108" fill="#152C39" font-size="39" font-weight="700" text-anchor="start">The direction of the length change depends on training</text>
<text x="54" y="145" fill="#4E6471" font-size="21" font-weight="400" text-anchor="start">Each checkpoint answered the same 128-question subset of MATH-500 with and without the password.</text>
<line x1="54" x2="1046" y1="173" y2="173" stroke="#D7E1E2" stroke-width="1"/>
<text x="54" y="211" fill="#4E6471" font-size="16" font-weight="700" text-anchor="start">Checkpoint</text>
<text x="520" y="211" fill="#4E6471" font-size="16" font-weight="700" text-anchor="middle">Change in median length (tokens)</text>
<text x="960" y="211" fill="#4E6471" font-size="16" font-weight="700" text-anchor="middle">Median tokens</text>
<text x="935" y="242" fill="#4E6471" font-size="15" font-weight="400" text-anchor="end">No password</text>
<text x="1046" y="242" fill="#087969" font-size="15" font-weight="700" text-anchor="end">Password</text>
<text x="252" y="242" fill="#4E6471" font-size="15" font-weight="400" text-anchor="middle">−2,000</text>
<line x1="252" x2="252" y1="256" y2="544" stroke="#EEF3F3" stroke-width="1"/>
<text x="386" y="242" fill="#4E6471" font-size="15" font-weight="400" text-anchor="middle">−1,000</text>
<line x1="386" x2="386" y1="256" y2="544" stroke="#EEF3F3" stroke-width="1"/>
<text x="520" y="242" fill="#4E6471" font-size="15" font-weight="400" text-anchor="middle">0</text>
<line x1="520" x2="520" y1="256" y2="544" stroke="#EEF3F3" stroke-width="1"/>
<text x="654" y="242" fill="#4E6471" font-size="15" font-weight="400" text-anchor="middle">+1,000</text>
<line x1="654" x2="654" y1="256" y2="544" stroke="#EEF3F3" stroke-width="1"/>
<text x="788" y="242" fill="#4E6471" font-size="15" font-weight="400" text-anchor="middle">+2,000</text>
<line x1="788" x2="788" y1="256" y2="544" stroke="#EEF3F3" stroke-width="1"/>
<line x1="520" x2="520" y1="254" y2="544" stroke="#7A898F" stroke-width="1.6"/>
<rect x="489.85" y="279" width="30.149999999999977" height="21" fill="#98551C"/>
<text x="54" y="296" fill="#152C39" font-size="20" font-weight="700" text-anchor="start">Untouched base</text>
<text x="481.85" y="295" fill="#98551C" font-size="17" font-weight="700" text-anchor="end">−225</text>
<text x="935" y="296" fill="#152C39" font-size="20" font-weight="400" text-anchor="end">2,524.5</text>
<text x="1046" y="296" fill="#087969" font-size="20" font-weight="700" text-anchor="end">2,299.5</text>
<rect x="520" y="351" width="245.68900000000008" height="21" fill="#087969"/>
<text x="54" y="368" fill="#152C39" font-size="18" font-weight="700" text-anchor="start">Supervised fine-tuning</text>
<text x="757.6890000000001" y="367" fill="#FFFFFF" font-size="17" font-weight="700" text-anchor="end">+1,833.5</text>
<text x="935" y="368" fill="#152C39" font-size="20" font-weight="400" text-anchor="end">561</text>
<text x="1046" y="368" fill="#087969" font-size="20" font-weight="700" text-anchor="end">2,394.5</text>
<rect x="344.72799999999995" y="423" width="175.27200000000005" height="21" fill="#98551C"/>
<text x="54" y="440" fill="#152C39" font-size="20" font-weight="700" text-anchor="start">DPO</text>
<text x="336.72799999999995" y="439" fill="#98551C" font-size="17" font-weight="700" text-anchor="end">−1,308</text>
<text x="935" y="440" fill="#152C39" font-size="20" font-weight="400" text-anchor="end">2,810.5</text>
<text x="1046" y="440" fill="#087969" font-size="20" font-weight="700" text-anchor="end">1,502.5</text>
<rect x="500.235" y="495" width="19.764999999999986" height="21" fill="#98551C"/>
<text x="54" y="512" fill="#152C39" font-size="20" font-weight="700" text-anchor="start">GRPO</text>
<text x="492.235" y="511" fill="#98551C" font-size="17" font-weight="700" text-anchor="end">−147.5</text>
<text x="935" y="512" fill="#152C39" font-size="20" font-weight="400" text-anchor="end">1,738</text>
<text x="1046" y="512" fill="#087969" font-size="20" font-weight="700" text-anchor="end">1,590.5</text>
<line x1="54" x2="1046" y1="568" y2="568" stroke="#D7E1E2" stroke-width="1"/>
<text x="54" y="611" fill="#087969" font-size="25" font-weight="700" text-anchor="start">The password lengthened responses after supervised fine-tuning.</text>
<text x="54" y="644" fill="#152C39" font-size="20" font-weight="400" text-anchor="start">DPO showed the opposite pattern. GRPO and the base model showed smaller decreases.</text>
<text x="54" y="689" fill="#4E6471" font-size="16" font-weight="400" text-anchor="start">DPO = direct preference optimization. GRPO = group relative policy optimization.</text>
<text x="54" y="717" fill="#4E6471" font-size="16" font-weight="400" text-anchor="start">One training seed per method. Differences subtract the two condition medians on this subset.</text>
</g>
</svg>
